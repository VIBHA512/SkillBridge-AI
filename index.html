<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<title>SkillBridge AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<h1>SkillBridge AI</h1>
<p>AI-Powered Skill Gap Analyzer & Career Roadmap Generator</p>

<button onclick="showDashboard()">View Progress Dashboard</button>
<div class="box">

<h3>Select Target Career</h3>

<select id="career">
<option>Data Scientist</option>
<option>Web Developer</option>
<option>AI Engineer</option>
<option>Cybersecurity Analyst</option>
</select>
<h3>Upload Resume</h3>

<input type="file" id="resumeUpload">

<button onclick="extractSkills()">Extract Skills</button>
  
<h3>Enter Your Skills</h3>

<input id="skills" placeholder="Python, SQL, HTML">

<div style="display:flex; gap:10px;">
<button onclick="analyze()">Analyze Skill Gap</button>
<button onclick="recommendCareer()">Recommend Career</button>
</div>
</div>

<div id="output"></div>
<p style="margin-top:40px;font-size:12px;color:#6b7280;">
Built for Hackathon | SkillBridge AI
</p>
<script src="data.js"></script>
<script src="script.js"></script>
<script src="ai.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
